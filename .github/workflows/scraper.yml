name: Scraper

# Coleta os dados públicos do JúpiterWeb e grava no Supabase.
# Semanal o ano todo e diário nos meses de matrícula. Também roda sob demanda.
on:
  schedule:
    # Toda segunda, 06:00 UTC (03:00 em São Paulo).
    - cron: "0 6 * * 1"
    # Todo dia em janeiro, fevereiro, julho e agosto (janelas de matrícula).
    - cron: "0 6 * 1,2,7,8 *"
  workflow_dispatch:

concurrency:
  group: scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coletar:
    name: Coletar e gravar
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Sem cache: em produção toda execução lê as páginas de novo.
      # Se o scraper falhar, o job fica vermelho e o GitHub avisa por e-mail.
      - run: pnpm scrape --sem-cache
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
